version: "3.8"

services:
  mongodb:
    image: mongo:latest
    container_name: mongo-local
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    container_name: notes-backend-container
    ports:
      - "8090:8080"
    environment:
      - PORT=8080
      - MONGO_URI=mongodb://mongodb:27017/notesdb
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: notes-frontend-container
    ports:
      - "3000:80"
    depends_on:
      - backend